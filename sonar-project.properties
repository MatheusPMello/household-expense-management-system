# =============================================================================
# SonarCloud Configuration - HomeLedger
# =============================================================================

# Project Identification & Cloud Binding
sonar.organization=matheuspmello
sonar.projectKey=MatheusPMello_household-expense-management-system
sonar.projectName=HomeLedger - Shared Household Expense Management System
sonar.projectVersion=1.0.0

# Source & Test Scope
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8

# Python Analysis & Pytest Coverage Import
sonar.python.version=3.13
sonar.python.coverage.reportPaths=backend/coverage.xml

# TypeScript / React Analysis
sonar.typescript.tsconfigPath=frontend/tsconfig.json

# General File Exclusions
# Exclude third-party dependencies, build output, database files, cache, and migration scripts
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/venv/**,\
  **/.venv/**,\
  **/*.db,\
  **/.pytest_cache/**,\
  **/.coverage,\
  **/alembic/versions/**

# Coverage Exclusions
# Tells SonarCloud to analyze frontend files for bugs & code smells, but only calculate coverage on backend Python code
sonar.coverage.exclusions=\
  frontend/**,\
  backend/tests/**

